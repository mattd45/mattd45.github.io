# Locked-down kiosk compositor config. Installed read-only to /opt/senior-laptop/shell/sway.conf.
default_border none
default_floating_border none
hide_edge_borders both
focus_follows_mouse no
font pango:sans 14
output * bg #FFFFFF solid_color

# Large cursor, slow gentle pointer, UK keyboard (change xkb_layout if hers differs).
seat * xcursor_theme Adwaita 48
input type:pointer {
    accel_profile flat
    pointer_accel -0.3
}
input type:keyboard {
    xkb_layout gb
}

# Keys that close windows or open new ones do nothing.
bindsym ctrl+w nop
bindsym ctrl+shift+w nop
bindsym ctrl+q nop
bindsym ctrl+shift+q nop
bindsym alt+f4 nop
bindsym f11 nop
bindsym ctrl+t nop
bindsym ctrl+shift+t nop
bindsym ctrl+n nop
bindsym ctrl+shift+n nop

exec /usr/bin/python3 /opt/senior-laptop/shell/shell.py
